<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4H Event Hub</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
    <link rel="stylesheet" href="/css/index.css">
</head>
<body>
    <!-- Settings Icon -->
    <a href="/admin.html" class="settings-icon" title="Admin">⚙️</a>

    <!-- Event Header -->
    <header class="event-header">
        <img id="eventLogo" class="event-logo hidden" alt="Event logo">
        <h1 class="event-title" id="eventTitle">4H Event Hub</h1>
        <p class="event-subtitle" id="eventSubtitle">Laster...</p>
    </header>

    <!-- Program Section -->
    <section class="program-section">
        <div class="program-container" id="programContainer">
            <div class="loading">Laster program...</div>
        </div>
    </section>

    <!-- Action Buttons -->
    <section class="action-buttons">
        <a href="/profile.html" class="action-btn profile-btn">
            <span class="btn-icon">👤</span>
            <span class="btn-text">Min profil</span>
        </a>
        <a href="/participant.html" class="action-btn games-btn">
            <span class="btn-icon">🎮</span>
            <span class="btn-text">Spill og utfordringer</span>
        </a>
    </section>

    <!-- Participant Search Section -->
    <section class="participant-section">
        <div class="section-toggle" id="sectionToggle">
            <span class="toggle-icon">▼</span>
            <h2>Deltakerinfo</h2>
        </div>

        <div class="participant-content" id="participantContent">
            <!-- Search Display -->
            <div class="search-display">
                <div class="search-text" id="searchText">_</div>
                <button id="resetBtn" class="reset-button" title="Nullstill søk">✕</button>
            </div>

            <!-- On-screen Keyboard -->
            <div class="keyboard" id="keyboard">
                <!-- Row 1 -->
                <div class="keyboard-row">
                    <button class="key" data-key="Q">Q</button>
                    <button class="key" data-key="W">W</button>
                    <button class="key" data-key="E">E</button>
                    <button class="key" data-key="R">R</button>
                    <button class="key" data-key="T">T</button>
                    <button class="key" data-key="Y">Y</button>
                    <button class="key" data-key="U">U</button>
                    <button class="key" data-key="I">I</button>
                    <button class="key" data-key="O">O</button>
                    <button class="key" data-key="P">P</button>
                    <button class="key" data-key="Å">Å</button>
                </div>
                <!-- Row 2 -->
                <div class="keyboard-row">
                    <button class="key" data-key="A">A</button>
                    <button class="key" data-key="S">S</button>
                    <button class="key" data-key="D">D</button>
                    <button class="key" data-key="F">F</button>
                    <button class="key" data-key="G">G</button>
                    <button class="key" data-key="H">H</button>
                    <button class="key" data-key="J">J</button>
                    <button class="key" data-key="K">K</button>
                    <button class="key" data-key="L">L</button>
                    <button class="key" data-key="Ø">Ø</button>
                    <button class="key" data-key="Æ">Æ</button>
                </div>
                <!-- Row 3 -->
                <div class="keyboard-row">
                    <button class="key" data-key="Z">Z</button>
                    <button class="key" data-key="X">X</button>
                    <button class="key" data-key="C">C</button>
                    <button class="key" data-key="V">V</button>
                    <button class="key" data-key="B">B</button>
                    <button class="key" data-key="N">N</button>
                    <button class="key" data-key="M">M</button>
                    <button class="key key-backspace" data-key="Backspace">⌫</button>
                </div>
            </div>

            <!-- Participant Count -->
            <div class="participant-count">
                <span id="participantCount">0</span> deltakere
            </div>

            <!-- Participant Cards Grid -->
            <div class="participants-grid" id="participantsGrid">
                <!-- Populated by JavaScript -->
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="empty-state hidden">
                <p class="empty-icon">🔍</p>
                <p>Ingen deltakere funnet</p>
            </div>
        </div>
    </section>

    <!-- Participant Detail Modal -->
    <div id="detailModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Deltakerinfo</h2>
                <button id="closeModalBtn" class="close-btn">✕</button>
            </div>
            <div class="modal-body">
                <div class="detail-photo-container">
                    <img id="detailPhoto" src="" alt="Profilbilde" class="detail-photo">
                    <div id="detailPhotoPlaceholder" class="detail-photo-placeholder">👤</div>
                </div>
                <div class="detail-info">
                    <h1 id="detailName">-</h1>
                    <div class="detail-fields">
                        <p><strong>Alder:</strong> <span id="detailAge">-</span> år</p>
                        <p id="detailClubRow"><strong>Klubb:</strong> <span id="detailClub">-</span></p>
                        <p id="detailRoleRow"><strong>Rolle:</strong> <span id="detailRole">-</span></p>
                        <p id="detailTeamRow"><strong>Lag:</strong> <span id="detailTeam">-</span></p>
                    </div>
                </div>
                <!-- Team Members Section -->
                <div id="detailTeamMembersSection" class="detail-team-members-section hidden">
                    <h3 class="team-members-title">🏆 Lagmedlemmer</h3>
                    <div id="detailTeamMembersList" class="detail-team-members-list">
                        <!-- Populated by JavaScript -->
                    </div>
                </div>
                <!-- Courses Section -->
                <div id="detailCoursesSection" class="detail-courses-section hidden">
                    <h3 class="courses-title">📚 Påmeldte Kurs</h3>
                    <div id="detailCoursesList" class="detail-courses-list">
                        <!-- Populated by JavaScript -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/index.js"></script>
</body>
</html>
