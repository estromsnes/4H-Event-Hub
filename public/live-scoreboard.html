<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Scoreboard - QR Skattejakt</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
    <link rel="stylesheet" href="/css/main.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .scoreboard-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .scoreboard-header {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .scoreboard-header h1 {
            margin: 0 0 10px 0;
            color: #2c5f2d;
            font-size: 48px;
        }

        .scoreboard-header p {
            margin: 0;
            color: #666;
            font-size: 20px;
        }

        .last-updated {
            font-size: 14px;
            color: #999;
            margin-top: 10px;
        }

        .scoreboard-grid {
            display: grid;
            gap: 15px;
        }

        .team-card {
            background: white;
            border-radius: 15px;
            padding: 20px 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            display: grid;
            grid-template-columns: 80px 80px 1fr auto auto;
            align-items: center;
            gap: 20px;
            transition: transform 0.2s ease;
        }

        .team-photo {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            object-fit: cover;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
        }

        .team-photo-placeholder {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            background: linear-gradient(135deg, #e0e0e0, #f5f5f5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
        }

        .team-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
        }

        .team-card.completed {
            background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
            border: 2px solid #4CAF50;
        }

        .team-card.active {
            background: linear-gradient(135deg, #fff9e6, #fff3cd);
            border: 2px solid #FFC107;
        }

        .team-rank {
            font-size: 36px;
            font-weight: bold;
            text-align: center;
        }

        .team-rank.top3 {
            color: #4CAF50;
        }

        .team-name {
            font-size: 28px;
            font-weight: bold;
            color: #2c5f2d;
        }

        .team-progress {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .checkpoints-badge {
            background: #4CAF50;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 20px;
            font-weight: bold;
        }

        .progress-text {
            font-size: 14px;
            color: #666;
        }

        .team-time {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .time-badge {
            background: #2196F3;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 20px;
            font-weight: bold;
            font-family: 'Courier New', monospace;
        }

        .status-badge {
            font-size: 14px;
            padding: 4px 12px;
            border-radius: 12px;
            font-weight: 600;
        }

        .status-badge.completed {
            background: #4CAF50;
            color: white;
        }

        .status-badge.active {
            background: #FFC107;
            color: #000;
        }

        .no-data {
            background: white;
            border-radius: 15px;
            padding: 60px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        .no-data h2 {
            color: #666;
            margin: 0;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 24px;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid white;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .team-card {
                grid-template-columns: 60px 60px 1fr;
                gap: 15px;
            }

            .team-photo,
            .team-photo-placeholder {
                width: 60px;
                height: 60px;
                font-size: 28px;
            }

            .team-progress,
            .team-time {
                grid-column: 1 / -1;
                margin-top: 10px;
            }

            .team-rank {
                font-size: 28px;
            }

            .team-name {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="/index.html" class="nav-link">← Hjem</a>
        <h2>📊 Live Scoreboard</h2>
        <div style="width: 60px;"></div>
    </div>

    <div class="scoreboard-container">
        <div class="scoreboard-header">
            <h1>🎯 Live Scoreboard</h1>
            <p>QR Skattejakt - Sanntid</p>
            <p class="last-updated" id="lastUpdated">Laster...</p>
        </div>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Laster scoreboard...</p>
        </div>

        <div id="scoreboard" class="scoreboard-grid" style="display: none;"></div>

        <div id="noData" class="no-data" style="display: none;">
            <h2>Ingen lag har startet skattejakt ennå</h2>
            <p style="color: #999; margin-top: 10px;">Scoreboardet oppdateres automatisk hvert 5. sekund</p>
        </div>
    </div>

    <script>
        let refreshInterval;

        async function loadScoreboard() {
            try {
                const response = await fetch('/api/scavenger/live-scoreboard');
                if (!response.ok) {
                    throw new Error('Failed to load scoreboard');
                }

                const data = await response.json();
                renderScoreboard(data);

                // Update last updated time
                const lastUpdated = document.getElementById('lastUpdated');
                const time = new Date(data.timestamp).toLocaleTimeString('nb-NO');
                lastUpdated.textContent = `Sist oppdatert: ${time}`;
            } catch (err) {
                console.error('Error loading scoreboard:', err);
            }
        }

        function renderScoreboard(data) {
            const loading = document.getElementById('loading');
            const scoreboard = document.getElementById('scoreboard');
            const noData = document.getElementById('noData');

            loading.style.display = 'none';

            if (!data.scoreboard || data.scoreboard.length === 0) {
                noData.style.display = 'block';
                scoreboard.style.display = 'none';
                return;
            }

            noData.style.display = 'none';
            scoreboard.style.display = 'grid';

            scoreboard.innerHTML = data.scoreboard.map((team, index) => {
                const rank = index + 1;
                const isTop3 = rank <= 3;
                const statusClass = team.status === 'completed' ? 'completed' : 'active';
                const statusText = team.status === 'completed' ? 'Fullført' : 'Pågår';

                // Team photo or placeholder
                const photoHtml = team.team_photo_path
                    ? `<img src="${team.team_photo_path}?t=${Date.now()}" alt="${team.team_name}" class="team-photo">`
                    : `<div class="team-photo-placeholder">📸</div>`;

                return `
                    <div class="team-card ${statusClass}">
                        ${photoHtml}
                        <div class="team-rank ${isTop3 ? 'top3' : ''}">
                            ${rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : `#${rank}`}
                        </div>
                        <div class="team-name">${team.team_name}</div>
                        <div class="team-progress">
                            <div class="checkpoints-badge">
                                ${team.checkpoints_found} / ${team.total_checkpoints}
                            </div>
                            <div class="progress-text">sjekkpunkter</div>
                        </div>
                        <div class="team-time">
                            <div class="time-badge">
                                ${formatTime(team.elapsed_seconds)}
                            </div>
                            <div class="status-badge ${statusClass}">
                                ${statusText}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        // Initial load
        loadScoreboard();

        // Auto-refresh every 5 seconds
        refreshInterval = setInterval(loadScoreboard, 5000);

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (refreshInterval) {
                clearInterval(refreshInterval);
            }
        });
    </script>
</body>
</html>
