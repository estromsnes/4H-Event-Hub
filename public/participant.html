<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spill og utfordringer - 4H Event Hub</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
    <link rel="stylesheet" href="/css/participant.css">
</head>
<body>
    <!-- Back Button -->
    <a href="/index.html" class="back-btn" title="Tilbake">← Tilbake</a>

    <!-- Settings Icon -->
    <a href="/admin.html" class="settings-icon" title="Admin">⚙️</a>

    <!-- Header -->
    <header class="page-header">
        <img id="eventLogo" class="page-logo hidden" alt="Event logo">
        <h1 class="page-title">Spill og utfordringer</h1>
        <p class="page-subtitle">Velg aktivitet</p>
    </header>

    <!-- Activity Buttons -->
    <section class="activities-section" id="activitiesContainer">
        <p class="text-center" style="color: var(--text-light);">Laster aktiviteter...</p>
    </section>

    <!-- Additional Links -->
    <section class="extra-links">
        <a href="/live-scoreboard.html" class="extra-link scoreboard-link">
            <span class="extra-icon">🏆</span>
            <span>Se resultatliste</span>
        </a>
        <a href="/profile.html" class="extra-link profile-link">
            <span class="extra-icon">👤</span>
            <span>Min profil</span>
        </a>
    </section>

    <script>
        // Load event info
        async function loadEventInfo() {
            try {
                const response = await fetch('/api/event');
                if (response.ok) {
                    const event = await response.json();
                    if (event.event_name) {
                        document.title = event.event_name + ' - Spill og utfordringer';
                    }

                    if (event.logo_path) {
                        const logoImg = document.getElementById('eventLogo');
                        logoImg.src = event.logo_path + '?t=' + Date.now();
                        logoImg.classList.remove('hidden');
                    }
                }
            } catch (err) {
                console.error('Error loading event info:', err);
            }
        }

        // Load active activities
        async function loadActiveActivities() {
            try {
                const response = await fetch('/api/activities/status');
                const activities = await response.json();

                const container = document.getElementById('activitiesContainer');
                container.innerHTML = '';

                // Activity details mapping
                const activityDetails = {
                    team_challenge: {
                        url: '/team-challenge.html',
                        desc: 'Samle laget og ta lagbilde',
                        class: 'challenge-card'
                    },
                    photo_challenges: {
                        url: '/photo-challenges.html',
                        desc: 'Ta morsomme bilder sammen med laget',
                        class: 'photo-card'
                    },
                    selfie_chain: {
                        url: '/selfie-chain.html',
                        desc: 'Finn personer og ta selfies sammen',
                        class: 'selfie-card'
                    },
                    bingo: {
                        url: '/bingo.html',
                        desc: 'Møt andre deltakere og fyll ut bingo-kortet',
                        class: 'bingo-card'
                    },
                    quiz: {
                        url: '/quiz.html',
                        desc: 'Test kunnskapen til deg og laget ditt',
                        class: 'quiz-card'
                    },
                    scavenger_hunt: {
                        url: '/scavenger-hunt.html',
                        desc: 'Finn alle sjekkpunktene rundt på stedet',
                        class: 'hunt-card'
                    },
                    tic_tac_toe: {
                        url: '/tic-tac-toe.html',
                        desc: 'Spill mot en annen deltaker eller lag',
                        class: 'game-card'
                    }
                };

                // Show only active activities
                for (const [key, activity] of Object.entries(activities)) {
                    if (activity.active === 1) {
                        const details = activityDetails[key];
                        if (details) {
                            const card = createActivityCard(
                                activity.icon,
                                activity.name,
                                details.desc,
                                details.url,
                                details.class
                            );
                            container.appendChild(card);
                        }
                    }
                }

                if (container.children.length === 0) {
                    container.innerHTML = '<p class="text-center" style="color: var(--text-light);">Ingen aktiviteter er tilgjengelige akkurat nå.</p>';
                }
            } catch (err) {
                console.error('Error loading activities:', err);
                const container = document.getElementById('activitiesContainer');
                container.innerHTML = '<p class="text-center" style="color: #f44336;">Kunne ikke laste aktiviteter. Prøv igjen senere.</p>';
            }
        }

        // Create activity card element
        function createActivityCard(icon, title, description, url, className) {
            const a = document.createElement('a');
            a.href = url;
            a.className = `activity-card ${className}`;

            a.innerHTML = `
                <div class="activity-icon">${icon}</div>
                <div class="activity-content">
                    <h2 class="activity-title">${title}</h2>
                    <p class="activity-description">${description}</p>
                </div>
                <div class="activity-arrow">›</div>
            `;

            return a;
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadEventInfo();
            loadActiveActivities();
        });
    </script>
    <script src="/js/session-tracker.js"></script>
</body>
</html>
