<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velkommen! - 4H Event Hub</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/index.css">
    <link rel="stylesheet" href="/css/qr-scanner.css">
    <link rel="stylesheet" href="/css/welcome.css">
</head>
<body>
    <!-- Welcome Link (for registration staff) -->
    <a href="/index.html" class="welcome-link" title="Hjem">
        <span class="welcome-icon">🏠</span>
        <span class="welcome-text">Hjem</span>
    </a>

    <!-- Settings Icon -->
    <a href="/admin.html" class="settings-icon" title="Admin">⚙️</a>

    <!-- Event Header -->
    <header class="event-header">
        <img src="/images/4H-logo-O2.png" class="header-4h-logo" alt="4H Logo">
        <img id="eventLogo" class="event-logo hidden" alt="Event logo">
        <h1 class="event-title" id="eventTitle">4H Event Hub</h1>
        <p class="event-subtitle" id="eventSubtitle">Laster...</p>
    </header>

    <!-- Scanner View -->
    <div id="scanner-view" class="view active">
        <div class="welcome-container">
            <div class="welcome-header">
                <h1>🎉 Velkommen! 🎉</h1>
                <p class="welcome-subtitle">Skann QR-koden din for å komme i gang</p>
            </div>

            <div class="scanner-section">
                <!-- Hidden barcode input for scanner -->
                <input type="text" id="barcode-input" name="barcode-scanner" class="barcode-input" autocomplete="off">

                <!-- Login Word Input Section -->
                <div id="codeInputSection" class="code-input-section" style="margin-bottom: 25px;">
                    <p style="color: var(--text-light); margin-bottom: 15px; font-size: 16px;">Skriv inn ditt login-ord</p>
                    <div style="display: flex; gap: 10px; max-width: 400px; margin: 0 auto 20px;">
                        <input
                            type="text"
                            id="participantCodeInput"
                            name="participant-code"
                            placeholder="F.eks: 4H"
                            style="flex: 1; padding: 18px; font-size: 20px; border: 2px solid var(--primary-green); border-radius: 12px; text-align: center; text-transform: uppercase; font-weight: bold; letter-spacing: 2px;"
                            autocomplete="username"
                            maxlength="10"
                        >
                        <button id="codeLoginBtn" class="button primary" style="padding: 18px 25px; font-size: 18px;">
                            ➡️
                        </button>
                    </div>
                    <p style="color: var(--text-light); font-size: 14px; margin: -10px auto 20px; max-width: 400px; text-align: center;">
                        💡 Finner du dette på ditt navneskilt/deltakerkort
                    </p>
                    <div id="codeStatus" class="scan-status hidden" style="max-width: 400px; margin: 0 auto 20px;"></div>
                </div>

                <div class="divider">
                    <span>eller skann QR-kode</span>
                </div>

                <div class="scanner-mode-indicator">
                    <svg class="qr-icon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                        <rect x="2" y="2" width="8" height="8" rx="1"/>
                        <rect x="14" y="2" width="8" height="8" rx="1"/>
                        <rect x="2" y="14" width="8" height="8" rx="1"/>
                        <rect x="4" y="4" width="4" height="4" fill="white"/>
                        <rect x="16" y="4" width="4" height="4" fill="white"/>
                        <rect x="4" y="16" width="4" height="4" fill="white"/>
                        <rect x="14" y="14" width="2" height="2"/>
                        <rect x="18" y="14" width="2" height="2"/>
                        <rect x="14" y="18" width="2" height="2"/>
                        <rect x="20" y="18" width="2" height="2"/>
                        <rect x="12" y="12" width="2" height="2"/>
                    </svg>
                    <span>Skanner klar - skann QR-koden din!</span>
                </div>

                <div class="divider">
                    <span>eller</span>
                </div>

                <div id="qr-reader" class="qr-reader"></div>

                <button id="start-scan-btn" class="button primary" style="width: 100%; max-width: 400px; font-size: 18px; padding: 20px; margin: 0 auto 15px auto; display: block;">
                    📷 Start Kamera-Skanning
                </button>

                <div class="divider">
                    <span>eller</span>
                </div>

                <label for="qr-file-input" class="button secondary" style="width: 100%; max-width: 400px; font-size: 18px; padding: 20px; margin: 0 auto; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer;">
                    🖼️ Last opp bilde av QR
                </label>
                <input type="file" id="qr-file-input" accept="image/*" style="display: none;">

                <div class="scan-status" id="scan-status" style="display: none;"></div>
            </div>
        </div>
    </div>


    <!-- Load external libraries first -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="https://unpkg.com/jsqr@1.4.0/dist/jsQR.js"></script>

    <!-- Load app scripts after libraries are loaded -->
    <script src="/js/camera-detector.js"></script>
    <script src="/js/participant-auth.js"></script>
    <script src="/js/session-tracker.js"></script>
    <script src="/js/barcode-scanner-global.js"></script>
    <script src="/js/scanner.js"></script>
    <script src="/js/camera.js"></script>
    <script src="/js/qr-upload-visibility.js"></script>
    <script src="/js/welcome.js"></script>
</body>
</html>
